name: QA CI

on:
  push:
    branches:
      - QA
  pull_request:
    branches:
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check README formatting
        run: git diff --check

      - name: Detect API package
        id: api
        run: |
          if [ -f arbiter-api/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.api.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps
        if: steps.api.outputs.present == 'true'
        working-directory: arbiter-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API checks
        if: steps.api.outputs.present == 'true'
        working-directory: arbiter-api
        run: |
          python -m compileall app

      - name: Detect dashboard package
        id: dashboard
        run: |
          if [ -f arbiter-dashboard/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.dashboard.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: arbiter-dashboard/package-lock.json

      - name: Install dashboard deps
        if: steps.dashboard.outputs.present == 'true'
        working-directory: arbiter-dashboard
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build dashboard
        if: steps.dashboard.outputs.present == 'true'
        working-directory: arbiter-dashboard
        run: npm run build

