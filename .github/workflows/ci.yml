name: QA CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arbiter-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whitespace errors
        run: git diff --check

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: arbiter-api/requirements.txt

      - name: Install API deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall app

      - name: Lint
        run: ruff check --select E9,F app

      - name: Tests
        run: pytest app/tests -v

  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK and collector
        run: |
          python -m pip install --upgrade pip
          pip install ./arbiter-sdk ./arbiter-collector pytest

      - name: SDK tests
        working-directory: arbiter-sdk
        run: pytest tests -v

      - name: Collector tests
        working-directory: arbiter-collector
        run: pytest tests -v

  dashboard:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-value-not-a-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: arbiter-dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: arbiter-dashboard
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build dashboard
        working-directory: arbiter-dashboard
        run: npm run build
