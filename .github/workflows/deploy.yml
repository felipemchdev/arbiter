name: Deploy Arbiter

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arbiter-api

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: arbiter_test
          POSTGRES_USER: arbiter
          POSTGRES_PASSWORD: arbiter
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://arbiter:arbiter@localhost:5432/arbiter_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-ci
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://redis:6379/1
        run: pytest app/tests/ -v

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: arbiteracr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push API
        run: |
          docker build -t arbiteracr.azurecr.io/arbiter-api:${{ github.sha }} ./arbiter-api
          docker push arbiteracr.azurecr.io/arbiter-api:${{ github.sha }}
      - name: Build and push Dashboard
        run: |
          docker build -t arbiteracr.azurecr.io/arbiter-dashboard:${{ github.sha }} ./arbiter-dashboard
          docker push arbiteracr.azurecr.io/arbiter-dashboard:${{ github.sha }}
      - name: Deploy API
        run: |
          az containerapp update \
            --name arbiter-api --resource-group rg-eeip \
            --image arbiteracr.azurecr.io/arbiter-api:${{ github.sha }} \
            --set-env-vars \
            ARBITER_ADMIN_USER="${{ secrets.ARBITER_ADMIN_USER }}" \
            ARBITER_ADMIN_PASSWORD="${{ secrets.ARBITER_ADMIN_PASSWORD }}" \
            ARBITER_VIEWER_USER="${{ secrets.ARBITER_VIEWER_USER }}" \
            ARBITER_VIEWER_PASSWORD="${{ secrets.ARBITER_VIEWER_PASSWORD }}"
      - name: Deploy Worker
        run: az containerapp update --name arbiter-worker --resource-group rg-eeip --image arbiteracr.azurecr.io/arbiter-api:${{ github.sha }}
      - name: Deploy Dashboard
        run: az containerapp update --name arbiter-dashboard --resource-group rg-eeip --image arbiteracr.azurecr.io/arbiter-dashboard:${{ github.sha }}
