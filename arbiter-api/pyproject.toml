
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ modules re-export symbols on purpose.
"__init__.py" = ["F401"]
# Relationship annotations use forward references resolved by SQLAlchemy at runtime.
"app/models/*.py" = ["F821"]

[tool.ruff.format]
quote-style = "double"
