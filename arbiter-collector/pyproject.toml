[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter-collector"
version = "0.1.0"
description = "Arbiter Airflow collector"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1.0", "pydantic-settings>=2.3,<3.0"]

[project.scripts]
arbiter-collector = "collector.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["collector*"]