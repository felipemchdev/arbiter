services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: arbiter
      POSTGRES_USER: arbiter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbiter -d arbiter"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: ./arbiter-api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # .env.example ships ENVIRONMENT=development, which disables the startup
      # guard on placeholder SECRET_KEYs.
      ENVIRONMENT: "production"
      # Overrides .env: a copied .env.example ships RUN_SEEDS=true for the local
      # quickstart, and demo org/users must never land in a production database.
      RUN_SEEDS: "false"
      # The production bootstrap is the entrypoint's seed_prod upsert of this owner.
      # Requiring both values means a fresh volume cannot start with no login; compose
      # refuses to create the container when either one is missing.
      ARBITER_ADMIN_USER: ${ARBITER_ADMIN_USER:?set ARBITER_ADMIN_USER in .env (owner login)}
      ARBITER_ADMIN_PASSWORD: ${ARBITER_ADMIN_PASSWORD:?set ARBITER_ADMIN_PASSWORD in .env (owner password)}
    command: ["/entrypoint.sh"]
    restart: unless-stopped

  worker:
    build: ./arbiter-api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info
    restart: unless-stopped

  beat:
    build: ./arbiter-api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    restart: unless-stopped

  dashboard:
    build: ./arbiter-dashboard
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
